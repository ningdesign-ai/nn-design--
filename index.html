    body { background: #fff; color: #111; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .site-header { max-width: 1000px; margin: 0 auto; padding: 40px 24px 28px; text-align: center; }
    .site-header h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
    .site-header p { margin-top: 8px; font-size: 14px; color: #999; }
    .portfolio { max-width: 1000px; margin: 0 auto; }
    .portfolio img { width: 100%; display: block; }
    .video-section { max-width: 1000px; margin: 0 auto; padding: 64px 24px 40px; }

    .video-section-head h2 { font-size: 22px; font-weight: 700; }
    .video-section-head p { margin-top: 8px; font-size: 14px; color: #999; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px; }
    .video-card { margin: 0; }
    .video-card video { width: 100%; height: auto; display: block; border-radius: 12px; background: #000; }
    .video-card figcaption { padding: 12px 2px 0; }
    .video-card h3 { font-size: 16px; font-weight: 600; }
    .video-card p { margin-top: 6px; font-size: 13px; color: #888; line-height: 1.6; }
    .site-footer { max-width: 1000px; margin: 0 auto; padding: 40px 24px; text-align: center; color: #bbb; font-size: 13px; }
    @media (max-width: 680px) {
      .site-header { padding: 28px 16px 20px; }
      .site-header h1 { font-size: 20px; }
      .video-section { padding: 48px 16px 32px; }
      .video-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }
