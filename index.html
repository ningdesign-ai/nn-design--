<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宁宁的作品集</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="styles.css?v=11" />
  <style>
    body.auth-check {
      visibility: hidden;
    }
    body.auth-check.visible {
      visibility: visible;
    }
  </style>
</head>
<body class="auth-check">
  <div id="site-content" class="site-content">
    <header class="topbar">
      <div>
        <p class="brand">宁宁</p>
        <p class="subtitle">Ai视觉设计师 · 作品集</p>
      </div>
      <nav>
        <a href="#videos">视频</a>
        <a href="#images">图文</a>
      </nav>
      <span id="author-badge" class="author-badge hidden">作者模式</span>
        <button id="deauthorize-device" class="deauth-btn hidden" title="注销当前作者设备">注销设备</button>
    </header>

    <main>
      <section class="hero" id="hero-banner"></section>

      <section id="upload" class="section upload-section hidden">
        <div class="section-head">
          <p class="section-label">00</p>
          <h2>上传作品</h2>
        </div>
        <div class="upload-grid">
          <div class="upload-card banner-upload-card">
            <h3>更换顶部 Banner</h3>
            <p>选择一张宽幅图片作为页面顶部背景，推荐尺寸 1920×600。</p>
            <input id="banner-file" type="file" accept="image/*" />
            <button id="upload-banner">更换 Banner</button>
            <button id="remove-banner" class="banner-remove-btn">移除 Banner</button>
          </div>
          <div class="upload-card">
            <h3>上传视频</h3>
            <p>选择一个视频文件，上传后会显示到“视频作品”区域。</p>
            <input id="video-file" type="file" accept="video/*" />
            <button id="upload-video">上传视频</button>
          </div>
          <div class="upload-card">
            <h3>上传图文项目</h3>
            <p>项目支持多张图片，填写项目信息后上传。</p>
            <input id="project-title" type="text" placeholder="项目标题" />
            <textarea id="project-brief" placeholder="项目简介（卡片显示）"></textarea>
            <input id="project-images" type="file" accept="image/*" multiple />
            <input id="project-timeline" type="text" placeholder="项目时间（如：2024.03 — 2024.06）" />
            <textarea id="project-content" placeholder="项目内容"></textarea>
            <textarea id="project-results" placeholder="项目结果"></textarea>
            <button id="upload-project">上传项目</button>
          </div>
        </div>
      </section>

      <section id="videos" class="section">
        <div class="section-head">
          <p class="section-label">01</p>
          <h2>视频作品</h2>
        </div>
        <div class="grid">
          <article class="card">
            <div class="card-media">
              <div class="video-preview">
                <video src="TK风机带货视频-ai.mp4" preload="metadata" muted></video>
              </div>
            </div>
            <div class="card-body">
              <h3>TK风机带货视频</h3>
              <p>展示风机带货短视频方案，强调节奏感与视觉冲击。</p>
            </div>
          </article>
        </div>
      </section>

      <section id="images" class="section">
        <div class="section-head">
          <p class="section-label">02</p>
          <h2>图文作品</h2>
        </div>
        <div class="grid">
        </div>
      </section>
    </main>
  </div>

  <script src="script.js?v=11"></script>
</body>
</html>
